<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Book icon -->
  <g transform="translate(128,140)" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M-4,30 L-4,-30 C-4,-40 -14,-50 -30,-52 C-46,-54 -58,-48 -60,-40 L-60,26 C-58,20 -46,16 -30,18 C-14,20 -4,28 -4,30Z" fill="rgba(255,255,255,0.15)"/>
    <!-- Right page -->
    <path d="M4,30 L4,-30 C4,-40 14,-50 30,-52 C46,-54 58,-48 60,-40 L60,26 C58,20 46,16 30,18 C14,20 4,28 4,30Z" fill="rgba(255,255,255,0.15)"/>
    <!-- Spine -->
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <!-- Lines on pages -->
    <line x1="-45" y1="-20" x2="-15" y2="-20" stroke-width="3" opacity="0.6"/>
    <line x1="-45" y1="-8" x2="-15" y2="-8" stroke-width="3" opacity="0.6"/>
    <line x1="-45" y1="4" x2="-25" y2="4" stroke-width="3" opacity="0.6"/>
    <line x1="15" y1="-20" x2="45" y2="-20" stroke-width="3" opacity="0.6"/>
    <line x1="15" y1="-8" x2="45" y2="-8" stroke-width="3" opacity="0.6"/>
    <line x1="25" y1="4" x2="45" y2="4" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- AI sparkle -->
  <g fill="#fbbf24">
    <circle cx="185" cy="55" r="4"/>
    <circle cx="200" cy="40" r="6"/>
    <circle cx="215" cy="58" r="3"/>
    <circle cx="195" cy="70" r="3"/>
    <!-- Lines connecting -->
    <line x1="185" y1="55" x2="200" y2="40" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <line x1="200" y1="40" x2="215" y2="58" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <line x1="200" y1="40" x2="195" y2="70" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <line x1="185" y1="55" x2="195" y2="70" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Sparkle star -->
  <path d="M200,35 L202,38 L206,38 L203,41 L204,45 L200,42 L196,45 L197,41 L194,38 L198,38Z" fill="#fbbf24"/>
